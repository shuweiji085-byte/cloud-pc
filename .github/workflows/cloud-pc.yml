name: cloud-pc
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 命令
        default: uname -a; nproc; free -h
      topic:
        description: 频道
        default: dsh-cloud-pc-e79b8f38
      secs:
        description: 保持秒
        default: "0"
permissions:
  contents: read
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CMD: ${{ inputs.cmd }}
      TOPIC: ${{ inputs.topic }}
      SECS: ${{ inputs.secs }}
    steps:
      - uses: actions/checkout@v4
      - name: 开机
        run: |
          uname -a; nproc; free -h; df -h /
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget git jq unzip zip ripgrep tmux htop tree python3-pip python3-venv sqlite3 ffmpeg >/dev/null 2>&1 || true
      - name: 执行并回传
        run: |
          set +e
          OUT=/tmp/out.txt
          bash -lc "$CMD" >"$OUT" 2>&1
          RC=$?
          { echo "EXIT=$RC"; echo "-----"; head -c 3500 "$OUT"; } > /tmp/m.txt
          curl -s --max-time 25 -X POST "https://ntfy.sh/$TOPIC" -H "Title: cloud-pc done" --data-binary @/tmp/m.txt >/dev/null || echo 回传失败
          echo "已回传 $TOPIC 退出码 $RC"
          tail -60 "$OUT"
          if [ "$SECS" != "0" ]; then sleep "$SECS"; fi
